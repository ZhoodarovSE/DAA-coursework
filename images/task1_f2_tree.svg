<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Arial, sans-serif" font-size="14" fill="#222">
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="bold">Task 1, Function 2:  T(n) = T(n-1) + n</text>
  <g font-weight="bold" fill="#444">
    <text x="300" y="62">level</text><text x="370" y="62">calls</text><text x="440" y="62">size</text><text x="530" y="62">work</text>
  </g>
  <g stroke="#2b5797" stroke-width="2" fill="#e8f0fb">
    <rect x="100" y="80" width="120" height="34" rx="8"/>
    <rect x="100" y="140" width="120" height="34" rx="8"/>
    <rect x="100" y="200" width="120" height="34" rx="8"/>
    <rect x="100" y="295" width="120" height="34" rx="8" fill="#f3f3f3" stroke="#888"/>
  </g>
  <g stroke="#2b5797" stroke-width="2">
    <line x1="160" y1="114" x2="160" y2="140"/><line x1="160" y1="174" x2="160" y2="200"/>
    <line x1="160" y1="234" x2="160" y2="250"/><line x1="160" y1="280" x2="160" y2="295"/>
  </g>
  <g text-anchor="middle">
    <text x="160" y="102">fun(n)</text><text x="160" y="162">fun(n-1)</text><text x="160" y="222">fun(n-2)</text>
    <text x="160" y="270" font-size="20">⋮</text><text x="160" y="317">fun(0) stop</text>
  </g>
  <text x="300" y="102">0</text><text x="370" y="102">1</text><text x="440" y="102">n</text><text x="530" y="102">n</text>
  <text x="300" y="162">1</text><text x="370" y="162">1</text><text x="440" y="162">n-1</text><text x="530" y="162">n-1</text>
  <text x="300" y="222">2</text><text x="370" y="222">1</text><text x="440" y="222">n-2</text><text x="530" y="222">n-2</text>
  <text x="300" y="270">…</text><text x="370" y="270">…</text><text x="440" y="270">…</text><text x="530" y="270">…</text>
  <text x="300" y="317">n</text><text x="370" y="317">1</text><text x="440" y="317">0</text><text x="530" y="317">0</text>
  <text x="20" y="370" font-weight="bold" fill="#b03030" xml:space="preserve">Total: n + (n-1) + … + 1 = n(n+1)/2   →   O(n²)      Depth = n</text>
</svg>
