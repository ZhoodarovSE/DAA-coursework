<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" font-family="Arial, sans-serif" font-size="14" fill="#222">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="bold">Task 1, Function 4:  T(n) = 2T(n-1) + 1</text>
  <g font-weight="bold" fill="#444">
    <text x="520" y="62">level</text><text x="580" y="62">calls</text><text x="645" y="62">size</text><text x="715" y="62">work</text>
  </g>
  <g stroke="#2b5797" stroke-width="2">
    <line x1="250" y1="114" x2="130" y2="160"/><line x1="250" y1="114" x2="370" y2="160"/>
    <line x1="130" y1="194" x2="70" y2="240"/><line x1="130" y1="194" x2="190" y2="240"/>
    <line x1="370" y1="194" x2="310" y2="240"/><line x1="370" y1="194" x2="430" y2="240"/>
  </g>
  <g stroke="#2b5797" stroke-width="2" fill="#e8f0fb">
    <rect x="200" y="80" width="100" height="34" rx="8"/>
    <rect x="80" y="160" width="100" height="34" rx="8"/><rect x="320" y="160" width="100" height="34" rx="8"/>
    <rect x="25" y="240" width="90" height="34" rx="8"/><rect x="145" y="240" width="90" height="34" rx="8"/>
    <rect x="265" y="240" width="90" height="34" rx="8"/><rect x="385" y="240" width="90" height="34" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="250" y="102">fun(n)</text>
    <text x="130" y="182">fun(n-1)</text><text x="370" y="182">fun(n-1)</text>
    <text x="70" y="262">fun(n-2)</text><text x="190" y="262">fun(n-2)</text><text x="310" y="262">fun(n-2)</text><text x="430" y="262">fun(n-2)</text>
    <text x="250" y="305" font-size="20">⋮</text>
    <text x="250" y="340">2ⁿ calls of fun(0) at the bottom</text>
  </g>
  <text x="520" y="102">0</text><text x="580" y="102">1</text><text x="645" y="102">n</text><text x="715" y="102">1</text>
  <text x="520" y="182">1</text><text x="580" y="182">2</text><text x="645" y="182">n-1</text><text x="715" y="182">2</text>
  <text x="520" y="262">2</text><text x="580" y="262">4</text><text x="645" y="262">n-2</text><text x="715" y="262">4</text>
  <text x="520" y="305">…</text><text x="580" y="305">…</text><text x="645" y="305">…</text><text x="715" y="305">…</text>
  <text x="520" y="340">n</text><text x="580" y="340">2ⁿ</text><text x="645" y="340">0</text><text x="715" y="340">2ⁿ</text>
  <text x="20" y="390" font-weight="bold" fill="#b03030" xml:space="preserve">Total: 1 + 2 + 4 + … + 2ⁿ = 2ⁿ⁺¹ − 1   →   O(2ⁿ)      Depth = n</text>
</svg>
